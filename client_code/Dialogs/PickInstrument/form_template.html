<div class="ui pi">
  <anvil-component type="Label" name="title_label" prop:role='["dlg-title"]'></anvil-component>
  <p class="muted" anvil:name="hint">Press one to hear it. Any part can change instrument later (Instrument tab).</p>
  <div class="pi-cats" anvil:name="cats_box">
    <anvil-component type="RepeatingPanel" name="cats_panel" prop:item_template="Humbeat.Items.WordChip" prop:role='["rb-chips"]'></anvil-component>
  </div>
  <anvil-component type="RepeatingPanel" name="inst_panel" prop:item_template="Humbeat.Items.InstTile" prop:role='["pi-grid"]'></anvil-component>
  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="add_button" prop:text="Add the track" prop:role='["btn", "btn-primary", "ic-plus"]'></anvil-component>
  </div>
</div>
