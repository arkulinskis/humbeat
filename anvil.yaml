metadata: {description: 'Make any song in your browser: pick a style from hopecore to heavy metal, record your voice with auto-tune, and hum a melody that becomes any instrument.', logo_img: 'asset:icon-512.png', title: 'Humbeat: hum a tune, make it a song, in your browser'}
name: Humbeat
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=d4c784e827"></script>
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/humbeat.json and run seo.py, not here) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="make a song online, hum to midi, humming to notes, online auto-tune, free music maker in browser, beatbox to drums, make a trap beat online, beginner music production, record vocals online, song maker for beginners">
    <meta name="author" content="Arkvital">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Humbeat">
    <meta property="og:title" content="Humbeat: hum a tune, make it a song, in your browser">
    <meta property="og:description" content="Make any song in your browser: pick a style from hopecore to heavy metal, record your voice with auto-tune, and hum a melody that becomes any instrument.">
    <meta property="og:locale" content="en_CA">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Humbeat: hum a tune, make it a song, in your browser">
    <meta name="twitter:description" content="Make any song in your browser: pick a style from hopecore to heavy metal, record your voice with auto-tune, and hum a melody that becomes any instrument.">
    <!-- seo:end -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=c74bd430b6">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=24470c0e52">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="hyng2w2" data-button="false" data-label="Submit feedback" async></script>
    <link rel="stylesheet" href="_/theme/icons.css?v=0be15c12d9">
    <link rel="stylesheet" href="_/theme/app.css?v=b10c07f45b">
    <script src="_/theme/app-kit.js?v=367552f827"></script>
    <script src="_/theme/hb-music.js?v=0cfaf3b3a3"></script>
    <script src="_/theme/hb-audio.js?v=81e1ad048f"></script>
    <script src="_/theme/hb-voice.js?v=d216bc7195"></script>
    <script src="_/theme/hb-studio.js?v=bebe2833fb"></script>
    <script src="_/theme/hb-art.js?v=87b85f9c45"></script>
package_name: Humbeat
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: false, enable_automatically: true, remember_me_days: 30, require_secure_passwords: true, use_email: true, use_google: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup: {module: startup, type: module}
